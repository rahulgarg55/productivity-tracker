<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="p-8">

    <div class="max-w-4xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-2">
                Productivity Tracker
            </h1>
            <p class="text-slate-400">Real-time system activity monitoring</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
            <div class="glass-card rounded-2xl p-6 flex flex-col items-center justify-center">
                <h3 class="text-slate-400 text-sm font-medium uppercase tracking-wider mb-2">Total Logs</h3>
                <span id="total-logs" class="text-5xl font-bold text-white">0</span>
            </div>
            
            <div class="glass-card rounded-2xl p-6 flex flex-col items-center justify-center">
                <h3 class="text-slate-400 text-sm font-medium uppercase tracking-wider mb-2">Productivity Score</h3>
                <span id="productivity-score" class="text-5xl font-bold text-emerald-400">0%</span>
            </div>
            
            <div class="glass-card rounded-2xl p-6 flex flex-col items-center justify-center">
                <h3 class="text-slate-400 text-sm font-medium uppercase tracking-wider mb-2">Distracted</h3>
                <span id="distracted-count" class="text-5xl font-bold text-rose-400">0</span>
            </div>

            <div class="glass-card rounded-2xl p-6 flex flex-col items-center justify-center">
                <h3 class="text-slate-400 text-sm font-medium uppercase tracking-wider mb-2">Idle</h3>
                <span id="idle-count" class="text-5xl font-bold text-amber-400">0</span>
            </div>
        </div>

        <div class="glass-card rounded-2xl p-8 text-center mb-6">
            <h2 class="text-2xl font-semibold mb-4">Latest Activity</h2>
            <div id="activity-status" class="inline-block px-4 py-2 rounded-full text-sm font-bold bg-slate-800 text-slate-300">
                Waiting for data...
            </div>
        </div>

        <div class="text-center">
            <button onclick="resetStats()" class="bg-rose-600 hover:bg-rose-700 text-white font-bold py-2 px-6 rounded-full transition-colors">
                Clear All History
            </button>
        </div>
    </div>

    <script>
        async function fetchStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                
                document.getElementById('total-logs').innerText = data.total_logs;
                document.getElementById('productivity-score').innerText = data.productivity_score.toFixed(1) + '%';
                document.getElementById('distracted-count').innerText = data.distracted_count || 0;
                document.getElementById('idle-count').innerText = data.idle_count || 0;
                
                const statusEl = document.getElementById('activity-status');
                if (data.productive_count > data.distracted_count) {
                    statusEl.innerText = "Highly Productive Session";
                    statusEl.className = "inline-block px-4 py-2 rounded-full text-sm font-bold bg-emerald-900/50 text-emerald-400 border border-emerald-500/30";
                } else if (data.total_logs > 0) {
                    statusEl.innerText = "High Distraction Warning";
                    statusEl.className = "inline-block px-4 py-2 rounded-full text-sm font-bold bg-rose-900/50 text-rose-400 border border-rose-500/30";
                }
            } catch (err) {
                console.error("Failed to load stats", err);
            }
        }
        
        async function resetStats() {
            if(confirm("Are you sure you want to clear all history?")) {
                await fetch('/api/stats/reset', { method: 'DELETE' });
                fetchStats();
            }
        }
        
        fetchStats();
        setInterval(fetchStats, 5000);
    </script>
</body>
</html>
