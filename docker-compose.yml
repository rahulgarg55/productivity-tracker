services:
  productivity-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: productivity-tracker-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PRODUCTIVITY_ADMIN_TOKEN=${PRODUCTIVITY_ADMIN_TOKEN:-sys-admin-token-2026}
      - ALLOWED_ORIGINS=*
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
