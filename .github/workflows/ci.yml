name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-validate:
    name: Test & Capacity Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r environment/app/requirements.txt

      - name: Start Server in Background
        run: |
          cd environment/app && python -m uvicorn main:app --port 8000 &
          sleep 4

      - name: Run Standard Test Suite
        run: python -m pytest tests/test_outputs.py -v

      - name: Run Enterprise Regression & Security Tests
        run: python -m pytest tests/test_enterprise.py -v

      - name: Run Load Testing & Capacity Validation
        run: python scripts/load_test.py
